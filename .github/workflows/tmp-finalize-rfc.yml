name: Temporary finalize RFC vertical slice

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: feat/rfc-0001-vertical-slice

      - name: Enable Corepack
        run: corepack enable

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.0.5

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format repository
        run: pnpm format:all

      - name: Validate static structure
        run: pnpm knip

      - name: Build
        run: pnpm build

      - name: Unit tests
        run: pnpm test

      - name: Full Trunk checks
        run: pnpm lint:trunk-all

      - name: Security-scoped checks
        run: pnpm lint:security

      - name: Compose integration tests
        run: pnpm test:integration:compose

      - name: Remove temporary workflows
        run: |
          rm -f .github/workflows/tmp-format-pr.yml
          rm -f .github/workflows/tmp-format-and-cleanup.yml
          rm -f .github/workflows/tmp-finalize-rfc.yml

      - name: Commit formatted cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "style: format and finalize RFC vertical slice"
          git push origin HEAD:feat/rfc-0001-vertical-slice
