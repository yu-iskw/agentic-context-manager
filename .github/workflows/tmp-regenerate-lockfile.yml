name: Temporary regenerate lockfile

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  regenerate:
    if: ${{ !contains(github.event.pull_request.head.sha, '0000000') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: feat/rfc-0001-vertical-slice

      - name: Enable Corepack
        run: corepack enable

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.0.5

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .node-version

      - name: Regenerate lockfile from manifests
        run: |
          rm pnpm-lock.yaml
          pnpm install --lockfile-only

      - name: Commit generated lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore(deps): regenerate pnpm lockfile"
          git push origin HEAD:feat/rfc-0001-vertical-slice
